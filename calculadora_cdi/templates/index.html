<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Investimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center mb-4">Calculadora de Investimento</h1>

        <form id="formulario" class="space-y-4">
            <div>
                <label for="capital" class="block text-sm font-semibold">Capital Investido</label>
                <input type="number" id="capital" name="capital" class="w-full px-4 py-2 border rounded-lg" required>
            </div>

            <div>
                <label for="frequencia" class="block text-sm font-semibold">Frequência</label>
                <select id="frequencia" name="frequencia" class="w-full px-4 py-2 border rounded-lg" required>
                    <option value="Y">Ano</option>
                    <option value="m">Mês</option>
                    <option value="D">Dia</option>
                </select>
            </div>

            <div>
                <label for="inicio" class="block text-sm font-semibold">Data Inicial (YYYY/MM/DD)</label>
                <input type="date" id="inicio" name="inicio" class="w-full px-4 py-2 border rounded-lg" required>
            </div>

            <div>
                <label for="final" class="block text-sm font-semibold">Data Final (YYYY/MM/DD)</label>
                <input type="date" id="final" name="final" class="w-full px-4 py-2 border rounded-lg" required>
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Calcular</button>
        </form>

        <div id="resultado" class="mt-6 hidden">
            <h2 class="text-xl font-semibold">Resultado:</h2>
            <pre id="resultado-text" class="bg-gray-200 p-4 rounded-lg"></pre>
        </div>
    </div>

    <script>
        document.getElementById("formulario").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const capital = document.getElementById("capital").value;
            const frequencia = document.getElementById("frequencia").value;
            const inicio = document.getElementById("inicio").value;
            const final = document.getElementById("final").value;

            try {
                const response = await axios.post('/calcular', {
                    capital: capital,
                    frequencia: frequencia,
                    inicio: inicio,
                    final: final
                });

                const resultado = response.data.capital_com_frequencia;
                document.getElementById("resultado").classList.remove("hidden");
                document.getElementById("resultado-text").textContent = JSON.stringify(resultado, null, 2);
            } catch (error) {
                alert("Erro ao calcular: " + error.message);
            }
        });
    </script>

</body>
</html>
